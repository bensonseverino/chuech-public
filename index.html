<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Avi icon (favicon) in both brand colors: the dark icon is used when the
      user's browser is in light mode (also the fallback), the white icon when
      it is in dark mode so it stays visible on dark tab strips.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-white.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Self-hosted Latin font subset — preload the main weight (SEO spec Step 8). -->
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-variable-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin=""
    />
    <!-- ImageKit media (imagekit-videos spec §5): warm the TLS/DNS route early. -->
    <link rel="preconnect" href="https://ik.imagekit.io" crossorigin />
    <link rel="dns-prefetch" href="https://ik.imagekit.io" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Per-route title, description, canonical, OG/Twitter and robots tags are
         rendered by <Seo /> (React 19 hoists them into <head>). The /work
         Pages Function rewrites these tags for case-study link previews. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
